name: Trigger Private Deployment

on:
  push:
    branches:
      - deployment  # Only deploy when you merge to main

jobs:
  trigger-private-cd:
    runs-on: ubuntu-latest  # Use GitHub's cloud, NOT your self-hosted runner
    steps:
      - name: Ping Private Repository
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.PRIVATE_REPO_TRIGGER_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com \
            -d '{"ref":"deployment"}'
